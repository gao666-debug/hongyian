<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>鸿颐安 · 本地守护</title><style>body{margin:0;background:#f1f5f4;color:#173b34;font:16px system-ui}main{max-width:760px;margin:auto;padding:24px}h1{font-size:26px}section{background:white;border-radius:18px;padding:20px;margin:16px 0}#metrics{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile{background:#eef7f3;padding:14px;border-radius:12px}.tile b{display:block;font-size:23px;margin-top:8px}button{background:#176c58;color:white;border:0;border-radius:10px;padding:13px;margin:6px 6px 6px 0;font:inherit}button:disabled{opacity:.5}input{box-sizing:border-box;width:100%;padding:11px;margin:6px 0 14px;border:1px solid #b4c8c0;border-radius:8px}small{color:#60776d}#message{white-space:pre-wrap}li{margin:12px 0}.bad{color:#b52e30}</style><main><h1>鸿颐安 · 本地守护</h1><p id="connection">正在连接开发板…</p><section><div id="metrics"></div><p id="network"></p><small>本地数据约每两秒查询一次；操作和查询依次执行；数据不可用时显示“暂无数据”。</small></section><section><h2>报警处理</h2><p id="alarm">正在读取…</p><button onclick="command('ack')">确认报警</button><button onclick="command('mute')">暂时静音</button><p>确认不会强行清除仍存在的环境异常。</p><p id="message" role="status"></p></section><section><h2>历史报警与活动记录</h2><small>这里保留发生过的事件；确认报警不会删除历史。</small><ul id="events"></ul></section><section><h2>联网与设置</h2><form id="settings"><label>Wi-Fi 名称<input id="ssid" maxlength="32" required autocomplete="off"></label><label>Wi-Fi 密码（留空保留原密码）<input id="password" type="password" maxlength="64" autocomplete="new-password"></label><label>无活动提醒时长（秒）<input id="inactive" type="number" min="1" required></label><label>上报间隔（秒）<input id="report" type="number" min="1" required></label><button>保存设置</button></form><small>Wi-Fi 修改保存后，长按主板 K5 切换到联网模式；已经处于联网模式时需重启生效。只支持主板兼容的 Wi-Fi 网络。</small></section></main><script>
const $=id=>document.getElementById(id);let busy=false,controlBusy=false,lastEvents=null;let requestChain=Promise.resolve();
function api(path,options={}){const work=requestChain.then(()=>request(path,options));requestChain=work.catch(()=>{});return work}
async function request(path,options={}){const c=new AbortController(),t=setTimeout(()=>c.abort(),8000);try{const r=await fetch(path,{...options,cache:'no-store',signal:c.signal});const j=await r.json();if(!r.ok)throw Error(j.error||('HTTP '+r.status));return j}finally{clearTimeout(t)}}
function value(v,ok,unit=''){return ok&&typeof v==='number'&&Number.isFinite(v)?v.toFixed(1)+unit:'暂无数据'}
function tile(name,text){const d=document.createElement('div');d.className='tile';d.textContent=name;const b=document.createElement('b');b.textContent=text;d.append(b);return d}
async function refresh(){if(busy||controlBusy){setTimeout(refresh,2000);return}busy=true;try{const s=await api('/status');$('connection').textContent='已连接开发板 · '+s.fw+(s.data_stale?' · 采样已过期':'');$('connection').className=s.data_stale?'bad':'';const valid=!s.data_stale;const items=[['温度',value(s.temp,valid&&s.env_available,' ℃')],['湿度',value(s.humi,valid&&s.env_available,' %')],['人体活动',valid&&s.body_valid?(s.body?'有活动':'无活动'):'暂无数据'],['无活动时长',valid&&s.body_valid?s.inactive+' 秒':'暂无数据'],['房门',!s.door_enabled?'未接入':valid&&s.door_valid?(s.door?'开':'关'):'暂无数据'],['夜灯',s.living?(s.living.night_on?'开启':'关闭'):'暂无数据']];$('metrics').replaceChildren(...items.map(x=>tile(...x)));$('network').textContent='模式：'+(s.mode==='AP'?'本地热点':'联网模式')+(s.mode==='AP'?' · 云端：本地模式未启用':' · 云端：'+(s.mqtt?'已连接':'未连接'))+(s.mode==='STA'?' · Wi-Fi：'+(s.sta?'已连接':'未连接'):'');$('alarm').textContent=s.alarm?'当前存在报警'+(s.mute?'（静音中）':''):'当前无报警';const eventKey=s.boot_id+':'+s.event_revision;if(lastEvents!==eventKey){const e=await api('/events');$('events').replaceChildren(...e.events.slice().reverse().map(x=>{const li=document.createElement('li');li.textContent=(x.name||x.tag)+' · '+(x.epoch?new Date(x.epoch*1000).toLocaleString():'本次开机后 '+x.up+' 秒');return li}));if(!e.events.length)$('events').textContent='暂无记录';lastEvents=eventKey}}catch(e){$('connection').textContent='连接中断，请保持连接主板热点；页面会自动重试。';$('connection').className='bad';$('metrics').replaceChildren(tile('实时数据','连接中断'))}finally{busy=false;setTimeout(refresh,2000)}}
async function command(name){controlBusy=true;const buttons=document.querySelectorAll('button');buttons.forEach(b=>b.disabled=true);try{const c=await api('/'+name,{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});$('message').textContent='指令已排队，等待主板执行…';let done=false;for(let i=0;i<10;i++){await new Promise(r=>setTimeout(r,500));const a=await api('/command?id='+c.command_id);if(a.boot_id!==c.boot_id)throw Error('主板已重启，请重新确认状态');if(a.state==='executed'){if(a.result!==0)throw Error('主板执行失败：'+a.result);done=true;break}}$('message').textContent=done?'主板已执行。求助可确认解除；环境或无活动条件仍存在时会保留报警，历史记录不会删除。':'尚未取得执行回执，请查看主板状态。'}catch(e){$('message').textContent='操作未确认：'+e.message}finally{controlBusy=false;buttons.forEach(b=>b.disabled=false)}}
$('settings').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;try{const data={wifi_ssid:$('ssid').value,noact_ms:Number($('inactive').value)*1000,report_ms:Number($('report').value)*1000};if($('password').value)data.wifi_pass=$('password').value;await api('/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});$('password').value='';$('message').textContent='设置已保存；网络设置需切换模式或重启后生效。'}catch(e){$('message').textContent='保存失败：'+e.message}finally{b.disabled=false}};
api('/config').then(c=>{$('ssid').value=c.wifi_ssid;$('inactive').value=c.noact_ms/1000;$('report').value=c.report_ms/1000}).catch(()=>{$('message').textContent='配置加载失败，请刷新后重试'});refresh();
</script></html>
